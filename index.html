<!doctype html>
<html lang="ja" data-theme="light" data-design="standard">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      // Apply saved appearance before first paint (mirrors src/app/uiPrefs.ts + applyPrefs) so no theme flash.
      (function () {
        var r = document.documentElement, p = {};
        try { p = JSON.parse(localStorage.getItem("lifeos.ui") || "{}") || {}; } catch (e) {}
        var dark = p.theme === "dark" || (p.theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var d = p.design === "glass" || p.design === "material" ? p.design : "standard";
        var c = { standard: ["#f5f5f7", "#000000"], glass: ["#e3f4f4", "#0b1e26"], material: ["#f8fafd", "#131314"] }[d];
        r.dataset.theme = dark ? "dark" : "light"; r.dataset.design = d; r.dataset.reduceMotion = p.reduceMotion ? "1" : "0";
        if (typeof p.fontScale === "number") r.style.setProperty("--ui-font-scale", String(p.fontScale));
        if (typeof p.spaceScale === "number") r.style.setProperty("--ui-space-scale", String(p.spaceScale));
        if (typeof p.radiusScale === "number") r.style.setProperty("--ui-radius-scale", String(p.radiusScale));
        document.querySelector('meta[name="theme-color"]').setAttribute("content", c[dark ? 1 : 0]);
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Life OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
